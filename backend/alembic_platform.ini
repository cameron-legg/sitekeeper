# Alembic configuration for the PLATFORM database (sk_platform).
#
# This is separate from the tenant migrations in alembic.ini.
# Run with:
#   cd backend
#   PLATFORM_DATABASE_URL=postgresql://... venv/bin/alembic -c alembic_platform.ini upgrade head

[alembic]
script_location = %(here)s/platform_migrations
prepend_sys_path = .
path_separator = os

# Placeholder — overridden by env.py using PLATFORM_DATABASE_URL
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
